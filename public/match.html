<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>បាល់ទាត់ផ្ទាល់</title>
  <meta name="theme-color" content="#0b0f14">
  <meta property="og:title" content="បាល់ទាត់ផ្ទាល់">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2322c55e'/%3E%3Cpath d='M16 9l6 4.5-2.3 7h-7.4L10 13.5z' fill='%230b0f14'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Khmer:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="page-match">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">បាល់ទាត់ផ្ទាល់</span>
      </a>
      <nav class="nav">
        <a href="/">ផ្ទះ</a>
        <a href="/#matches">ការប្រកួត</a>
      </nav>
    </div>
  </header>

  <main class="container match-page">
    <a class="back-link" href="/" id="back-link">ត្រឡប់ក្រោយ</a>

    <section class="match-head" id="match-head" aria-live="polite">
      <div class="mh-league"><span class="skeleton-text"></span></div>
      <div class="mh-body">
        <div class="mh-team"><span class="logo logo-lg logo-fallback"></span><span class="skeleton-text"></span></div>
        <div class="mh-center"></div>
        <div class="mh-team"><span class="logo logo-lg logo-fallback"></span><span class="skeleton-text"></span></div>
      </div>
    </section>

    <div id="slot-1" class="ad-slot slot-top" data-slot="1" aria-label="ផ្ទាំងពាណិជ្ជកម្ម"></div>

    <section class="player-wrap">
      <div class="player" id="player"></div>
    </section>

    <div class="slot-row">
      <div id="slot-2" class="ad-slot slot-half" data-slot="2" aria-label="ផ្ទាំងពាណិជ្ជកម្ម"></div>
      <div id="slot-3" class="ad-slot slot-half" data-slot="3" aria-label="ផ្ទាំងពាណិជ្ជកម្ម"></div>
    </div>

    <section class="comments card" id="comments">
      <h2 class="section-title">មតិយោបល់ <span class="count-pill" id="comment-count">0</span></h2>
      <form class="comment-form" id="comment-form" autocomplete="off" novalidate>
        <input type="text" id="c-name" name="name" maxlength="40" placeholder="ឈ្មោះ (ស្រេចចិត្ត)" aria-label="ឈ្មោះ (ស្រេចចិត្ត)">
        <textarea id="c-body" name="body" maxlength="500" rows="2" required placeholder="សរសេរមតិយោបល់..." aria-label="សរសេរមតិយោបល់..."></textarea>
        <div class="form-row">
          <span class="char-count mono" id="c-count">0/500</span>
          <button type="submit" class="btn btn-primary" id="c-send">ផ្ញើ</button>
        </div>
      </form>
      <p class="empty-comments" id="c-empty" hidden>គ្មានមតិយោបល់នៅឡើយទេ</p>
      <ul class="comment-list" id="c-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">បាល់ទាត់ផ្ទាល់</div>
  </footer>

  <script id="page-data" type="application/json">{}</script>
  <script src="/js/common.js" defer></script>
  <script src="/js/match.js" defer></script>
</body>
</html>

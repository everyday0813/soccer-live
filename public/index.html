<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>បាល់ទាត់ផ្ទាល់</title>
  <meta name="description" content="បាល់ទាត់ផ្ទាល់ · ការប្រកួត · ផ្សាយផ្ទាល់">
  <meta name="theme-color" content="#0b0f14">
  <meta property="og:title" content="បាល់ទាត់ផ្ទាល់">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2322c55e'/%3E%3Cpath d='M16 9l6 4.5-2.3 7h-7.4L10 13.5z' fill='%230b0f14'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Khmer:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=2">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">បាល់ទាត់ផ្ទាល់</span>
      </a>
      <nav class="nav">
        <a href="/" aria-current="page">ផ្ទះ</a>
        <a href="#matches">ការប្រកួត</a>
      </nav>
    </div>
  </header>

  <main class="container" id="matches">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-filter="all" aria-selected="true">ការប្រកួត <span class="tab-count" data-count="all"></span></button>
      <button class="tab" role="tab" data-filter="live" aria-selected="false"><i class="dot" aria-hidden="true"></i>ផ្សាយផ្ទាល់ <span class="tab-count" data-count="live"></span></button>
      <button class="tab" role="tab" data-filter="today" aria-selected="false">ថ្ងៃនេះ <span class="tab-count" data-count="today"></span></button>
      <button class="tab" role="tab" data-filter="tomorrow" aria-selected="false">ថ្ងៃស្អែក <span class="tab-count" data-count="tomorrow"></span></button>
    </div>

    <div class="match-table" id="match-table" aria-live="polite" aria-busy="true">
      <div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>
      <div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">បាល់ទាត់ផ្ទាល់ · <span id="year"></span></div>
  </footer>

  <script src="/js/common.js?v=2" defer></script>
  <script src="/js/home.js?v=2" defer></script>
</body>
</html>
